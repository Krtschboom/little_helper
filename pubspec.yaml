name: little_helper
description: SQLite-backed Flutter app with first-run database setup.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # SQLite with SQLCipher support on mobile AND desktop.
  sqlite3: ^3.0.0

  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  path: ^1.9.0
  file_picker: ^8.0.3
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

# Makes the sqlite3 hook bundle SQLCipher instead of plain SQLite.
# Requires a recent Flutter stable (Dart hooks support, Flutter 3.32+).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher